name: CI

on:
  push:
    # ci/** (W1, W2, LD297): a test branch pushed so a branch's code runs on Linux and Windows before it reaches main.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The full test suite runs on every supported Node across all three OSes.
  # orunmila has zero runtime deps, so `npm ci` only installs the c8 devdep.
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # W1 (LD297): the hooks as a user's machine runs them. The package is packed, installed globally into a prefix whose
  # path holds a space, and every installed hook command is run exactly as written, through the platform's shell
  # (cmd.exe on Windows) and, on Windows, through Git Bash too; the events are read back with `orunmila trail --json`.
  # (npm test runs the cmd.exe and /bin/sh form on every OS through test/smoke-hooks.js.)
  smoke:
    name: smoke (hooks as installed / ${{ matrix.os }} / ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: cmd }
          - { os: windows-latest, shell: bash }
          - { os: ubuntu-latest, shell: sh }
          - { os: macos-latest, shell: sh }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: The hooks, run as written
        run: node scripts/smoke-hooks.js ${{ matrix.shell == 'bash' && '--bash' || '' }}

  # PM1, PM4 (LD335, LD337): every install route (npm i -g, npx, npm i -D, pnpm dlx, pnpm add -g, pnpm add -D) into a
  # throwaway machine: every hook names the starter in Orunmila's home, runs, and still runs once the route's copy is
  # removed. pnpm comes through corepack. (npm test runs the npm routes on every OS through test/install-routes.js.)
  routes:
    name: install routes (npm and pnpm / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Every route, run and checked
        run: node scripts/install-routes.js

  # The coverage gate (c8 check-coverage in .c8rc.json) and the detection
  # accuracy gate are the two quality bars. They are deterministic on Linux;
  # we run them once on the primary OS/Node to keep the matrix fast and the
  # gates authoritative in one place.
  gates:
    name: coverage + accuracy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (eslint flat config)
        run: npm run lint
      - name: Coverage gate (enforced thresholds in .c8rc.json)
        run: npm run coverage
      - name: Detection accuracy gate (>= 95% with the sentinel on)
        run: npm run accuracy:gate
